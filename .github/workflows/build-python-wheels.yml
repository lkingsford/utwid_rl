name: Build Python Wheels

on:
  push:
    tags:
      - 'd-*'
      - 't-*'

jobs:
  build_dist_wheel:
    name: Build mon2y-dist wheel
    if: startsWith(github.ref, 'refs/tags/d-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tool
        run: python -m pip install build

      - name: Build mon2y-dist wheel
        run: python -m build -w -o wheels/ python/mon2y_dist

      - name: Upload mon2y-dist wheel
        uses: actions/upload-artifact@v4
        with:
          name: mon2y-dist-wheel
          path: wheels/

  build_trial_daemon_wheel:
    name: Build mon2y-trial-daemon wheel
    if: startsWith(github.ref, 'refs/tags/t-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tool
        run: python -m pip install build

      - name: Build mon2y-trial-daemon wheel
        run: python -m build -w -o wheels/ python/mon2y_trial_daemon
      
      - name: Upload mon2y-trial-daemon wheel
        uses: actions/upload-artifact@v4
        with:
          name: mon2y-trial-daemon-wheel
          path: wheels/
