name: Build Python Wheels

on:
  push:
    tags:
      - 'd-*'
      - 't-*'

jobs:
  build_dist_wheel:
    name: Build mon2y-dist wheel
    if: startsWith(github.ref, 'refs/tags/d-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tool
        run: python -m pip install build

      - name: Build mon2y-dist wheel
        run: python -m build -w -o wheels/ python/mon2y_dist

      - name: Upload mon2y-dist wheel
        uses: actions/upload-artifact@v4
        with:
          name: mon2y-dist-wheel
          path: wheels/

      - name: Get wheel filename
        id: get_filename
        run: |
          WHEEL_PATH=$(ls wheels/*.whl)
          echo "filename=$(basename $WHEEL_PATH)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload wheel to S3
        run: |
          aws s3 cp wheels/${{ steps.get_filename.outputs.filename }} s3://mon2y/mon2y/${{ steps.get_filename.outputs.filename }}
        shell: bash

  build_trial_daemon_wheel:
    name: Build mon2y-trial-daemon wheel
    if: startsWith(github.ref, 'refs/tags/t-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build tool
        run: python -m pip install build

      - name: Build mon2y-trial-daemon wheel
        run: python -m build -w -o wheels/ python/mon2y_trial_daemon
      
      - name: Upload mon2y-trial-daemon wheel
        uses: actions/upload-artifact@v4
        with:
          name: mon2y-trial-daemon-wheel
          path: wheels/

      - name: Get wheel filename
        id: get_filename
        run: |
          WHEEL_PATH=$(ls wheels/*.whl)
          echo "filename=$(basename $WHEEL_PATH)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload wheel to S3
        run: |
          aws s3 cp wheels/${{ steps.get_filename.outputs.filename }} s3://mon2y/mon2y/${{ steps.get_filename.outputs.filename }}
        shell: bash
