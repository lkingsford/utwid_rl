[package]
name = "mon2y_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }
clap-verbosity-flag = "3.0.0"
env_logger = "0.11.5"
log = "0.4.22"
rand = { version = "0.9.2", features = ["small_rng"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
chrono = "0.4.39"
linked_hash_set = "0.1.5"
itertools = "0.12.1"
rayon = "1.10.0"
crossterm = "0.28.1"
bitflags = "2.11.0"
lazy_static = "1.5.0"

[dev-dependencies]
test-env-log = "0.2.8"

[[bin]]
name = "utwid_auto"
path = "src/utwid_auto.rs"

[lib]
name = "mon2y"
path = "src/lib.rs"
# crate-type = ["cdylib", "rlib", "staticlib"]


[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = [
  "-Lnative=/home/lachlan/.xwin/crt/lib/x86_64",
  "-Lnative=/home/lachlan/.xwin/sdk/lib/um/x86_64",
  "-Lnative=/home/lachlan/.xwin/sdk/lib/ucrt/x86_64",
]
