[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mon2y-dashboard"
version = "0.1.0"
description = "A dashboard for monitoring mon2y runners."
requires-python = ">=3.8"
dependencies = [
    "dash",
    "pandas",
    "requests",
    "gunicorn"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mon2y_dashboard"]
